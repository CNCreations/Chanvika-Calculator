<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="Savings Goal Calculator — free calculator from Chanvika Calculator."><title>Savings Goal Calculator — Chanvika Calculator</title><link rel="stylesheet" href="../style.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="../index.html">Chanvika Calculator</a><nav class="nav-links"><a href="../index.html">Calculators</a><a href="../faq.html">FAQs</a></nav></div></header><main><section class="container page"><a class="back" href="../index.html">← All calculators</a><h1>Savings Goal Calculator</h1><p>Enter the values below to get an instant estimate.</p><div class="calculator-box"><div class="fields"><label>Target Amount (₹)<input id="target" type="number" inputmode="decimal" step="any" placeholder="e.g. 100000" min="0"></label><label>Current Savings (₹)<input id="current" type="number" inputmode="decimal" step="any" placeholder="e.g. 10000" min="0"></label><label>Time to Goal (months)<input id="months" type="number" inputmode="decimal" step="1" placeholder="e.g. 12" min="1"></label></div><button id="calculate">Calculate</button><div id="result" class="result" aria-live="polite"></div></div></section></main><footer class="footer"><div class="container">© 2026 Chanvika Calculator<div class="footer-links"><a href="../about.html">About Us</a><a href="../faq.html">FAQs</a><a href="../privacy-policy.html">Privacy Policy</a><a href="../terms-of-use.html">Terms of Use</a><a href="../disclaimer.html">Disclaimer</a></div></div></footer><script>document.getElementById('calculate').onclick=()=>{const result=document.getElementById('result');const t=+target.value,c=+current.value,m=+months.value;if(t<0||c<0||m<=0){result.textContent='Enter valid values.';return}const need=Math.max(0,t-c);result.innerHTML=`<b>Still needed:</b> ₹${need.toFixed(2)}<br><b>Monthly saving:</b> ₹${(need/m).toFixed(2)}`;};</script></body></html>
