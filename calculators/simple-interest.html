<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="Simple Interest Calculator — free calculator from Chanvika Calculator."><title>Simple Interest Calculator — Chanvika Calculator</title><link rel="stylesheet" href="../style.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="../index.html">Chanvika Calculator</a><nav class="nav-links"><a href="../index.html">Calculators</a><a href="../faq.html">FAQs</a></nav></div></header><main><section class="container page"><a class="back" href="../index.html">← All calculators</a><h1>Simple Interest Calculator</h1><p>Enter the values below to get an instant estimate.</p><div class="calculator-box"><div class="fields"><label>Principal (₹)<input id="principal" type="number" inputmode="decimal" step="any" placeholder="e.g. 10000" min="0"></label><label>Annual Interest Rate (%)<input id="rate" type="number" inputmode="decimal" step="any" placeholder="e.g. 8" min="0"></label><label>Time (years)<input id="years" type="number" inputmode="decimal" step="any" placeholder="e.g. 2" min="0"></label></div><button id="calculate">Calculate</button><div id="result" class="result" aria-live="polite"></div></div></section></main><footer class="footer"><div class="container">© 2026 Chanvika Calculator<div class="footer-links"><a href="../about.html">About Us</a><a href="../faq.html">FAQs</a><a href="../privacy-policy.html">Privacy Policy</a><a href="../terms-of-use.html">Terms of Use</a><a href="../disclaimer.html">Disclaimer</a></div></div></footer><script>document.getElementById('calculate').onclick=()=>{const result=document.getElementById('result');const p=+principal.value,r=+rate.value,t=+years.value;if(p<0||r<0||t<0){result.textContent='Enter valid values.';return}const i=p*r*t/100;result.innerHTML=`<b>Interest:</b> ₹${i.toFixed(2)}<br><b>Total:</b> ₹${(p+i).toFixed(2)}`;};</script></body></html>
