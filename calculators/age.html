<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="Age Calculator — calculate age from date of birth."><title>Age Calculator — Chanvika Calculator</title><link rel="stylesheet" href="../style.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="../index.html">Chanvika Calculator</a><nav class="nav-links"><a href="../index.html">Calculators</a><a href="../faq.html">FAQs</a></nav></div></header><main><section class="container page"><a class="back" href="../index.html">← All calculators</a><h1>Age Calculator</h1><p>Calculate completed years, months and days between a date of birth and a chosen date.</p><div class="calculator-box"><div class="fields"><label>Date of Birth<input id="dob" type="date"></label><label>Calculate Age On<input id="ondate" type="date"></label></div><button id="calculate">Calculate</button><div id="result" class="result" aria-live="polite"></div></div></section></main><footer class="footer"><div class="container">© 2026 Chanvika Calculator<div class="footer-links"><a href="../about.html">About Us</a><a href="../faq.html">FAQs</a><a href="../privacy-policy.html">Privacy Policy</a><a href="../terms-of-use.html">Terms of Use</a><a href="../disclaimer.html">Disclaimer</a></div></div></footer><script>const dob=document.getElementById('dob'),ondate=document.getElementById('ondate'),result=document.getElementById('result');ondate.value=new Date().toISOString().slice(0,10);document.getElementById('calculate').onclick=()=>{if(!dob.value||!ondate.value){result.textContent='Select both dates.';return}const d=new Date(dob.value+'T00:00:00'),o=new Date(ondate.value+'T00:00:00');if(d>o){result.textContent='Date of birth cannot be after the calculation date.';return}let y=o.getFullYear()-d.getFullYear(),m=o.getMonth()-d.getMonth(),day=o.getDate()-d.getDate();if(day<0){m--;day+=new Date(o.getFullYear(),o.getMonth(),0).getDate()}if(m<0){y--;m+=12}result.innerHTML=`<b>Age:</b> ${y} years, ${m} months, ${day} days`}</script></body></html>
