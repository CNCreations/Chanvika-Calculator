<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="Electricity Bill Calculator — free calculator from Chanvika Calculator."><title>Electricity Bill Calculator — Chanvika Calculator</title><link rel="stylesheet" href="../style.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="../index.html">Chanvika Calculator</a><nav class="nav-links"><a href="../index.html">Calculators</a><a href="../faq.html">FAQs</a></nav></div></header><main><section class="container page"><a class="back" href="../index.html">← All calculators</a><h1>Electricity Bill Calculator</h1><p>Enter the values below to get an instant estimate.</p><div class="calculator-box"><div class="fields"><label>Units Consumed (kWh)<input id="units" type="number" inputmode="decimal" step="any" placeholder="e.g. 180" min="0"></label><label>Fixed Charge (₹)<input id="fixed" type="number" inputmode="decimal" step="any" placeholder="e.g. 100" min="0"></label><label>First Slab Rate (₹/unit)<input id="rate1" type="number" inputmode="decimal" step="any" placeholder="e.g. 3" min="0"></label><label>First Slab Units<input id="slab1" type="number" inputmode="decimal" step="any" placeholder="e.g. 100" min="0"></label><label>Rate Above First Slab (₹/unit)<input id="rate2" type="number" inputmode="decimal" step="any" placeholder="e.g. 5" min="0"></label></div><button id="calculate">Calculate</button><div id="result" class="result" aria-live="polite"></div><p class="note">Tariffs differ by state, DISCOM and consumer category. This is not an official bill.</p></div></section></main><footer class="footer"><div class="container">© 2026 Chanvika Calculator<div class="footer-links"><a href="../about.html">About Us</a><a href="../faq.html">FAQs</a><a href="../privacy-policy.html">Privacy Policy</a><a href="../terms-of-use.html">Terms of Use</a><a href="../disclaimer.html">Disclaimer</a></div></div></footer><script>document.getElementById('calculate').onclick=()=>{const result=document.getElementById('result');const u=+units.value,f=+fixed.value,r1=+rate1.value,s=+slab1.value,r2=+rate2.value;if(u<0||f<0||r1<0||s<0||r2<0){result.textContent='Enter valid values.';return}const first=Math.min(u,s),rest=Math.max(0,u-s),energy=first*r1+rest*r2;result.innerHTML=`<b>Energy charge:</b> ₹${energy.toFixed(2)}<br><b>Fixed charge:</b> ₹${f.toFixed(2)}<br><b>Estimated bill:</b> ₹${(energy+f).toFixed(2)}`;};</script></body></html>
