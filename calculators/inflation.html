<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="Inflation Calculator — free calculator from Chanvika Calculator."><title>Inflation Calculator — Chanvika Calculator</title><link rel="stylesheet" href="../style.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="../index.html">Chanvika Calculator</a><nav class="nav-links"><a href="../index.html">Calculators</a><a href="../faq.html">FAQs</a></nav></div></header><main><section class="container page"><a class="back" href="../index.html">← All calculators</a><h1>Inflation Calculator</h1><p>Enter the values below to get an instant estimate.</p><div class="calculator-box"><div class="fields"><label>Today Amount (₹)<input id="amount" type="number" inputmode="decimal" step="any" placeholder="e.g. 100000" min="0"></label><label>Annual Inflation (%)<input id="rate" type="number" inputmode="decimal" step="any" placeholder="e.g. 6" min="0"></label><label>Years<input id="years" type="number" inputmode="decimal" step="any" placeholder="e.g. 10" min="0"></label></div><button id="calculate">Calculate</button><div id="result" class="result" aria-live="polite"></div><p class="note">This is a mathematical estimate; actual inflation varies over time and by category.</p></div></section></main><footer class="footer"><div class="container">© 2026 Chanvika Calculator<div class="footer-links"><a href="../about.html">About Us</a><a href="../faq.html">FAQs</a><a href="../privacy-policy.html">Privacy Policy</a><a href="../terms-of-use.html">Terms of Use</a><a href="../disclaimer.html">Disclaimer</a></div></div></footer><script>document.getElementById('calculate').onclick=()=>{const result=document.getElementById('result');const a=+amount.value,r=+rate.value,t=+years.value;if(a<0||r<0||t<0){result.textContent='Enter valid values.';return}const f=a*Math.pow(1+r/100,t);result.innerHTML=`<b>Estimated future cost:</b> ₹${f.toFixed(2)}<br><b>Increase:</b> ₹${(f-a).toFixed(2)}`;};</script></body></html>
