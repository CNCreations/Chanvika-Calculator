<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="Percentage Calculator — free calculator from Chanvika Calculator."><title>Percentage Calculator — Chanvika Calculator</title><link rel="stylesheet" href="../style.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="../index.html">Chanvika Calculator</a><nav class="nav-links"><a href="../index.html">Calculators</a><a href="../faq.html">FAQs</a></nav></div></header><main><section class="container page"><a class="back" href="../index.html">← All calculators</a><h1>Percentage Calculator</h1><p>Enter the values below to get an instant estimate.</p><div class="calculator-box"><div class="fields"><label>Number<input id="a" type="number" inputmode="decimal" step="any" placeholder="e.g. 25"></label><label>Base / Total<input id="b" type="number" inputmode="decimal" step="any" placeholder="e.g. 200"></label></div><button id="calculate">Calculate</button><div id="result" class="result" aria-live="polite"></div></div></section></main><footer class="footer"><div class="container">© 2026 Chanvika Calculator<div class="footer-links"><a href="../about.html">About Us</a><a href="../faq.html">FAQs</a><a href="../privacy-policy.html">Privacy Policy</a><a href="../terms-of-use.html">Terms of Use</a><a href="../disclaimer.html">Disclaimer</a></div></div></footer><script>document.getElementById('calculate').onclick=()=>{const result=document.getElementById('result');const x=+a.value,y=+b.value;if(y===0){result.textContent='Base cannot be zero.';return}result.innerHTML=`<b>Percentage:</b> ${(x/y*100).toFixed(2)}%<br><b>Difference:</b> ${Math.abs(x-y).toFixed(2)}<br><b>Change from base:</b> ${((x-y)/y*100).toFixed(2)}%`;};</script></body></html>
