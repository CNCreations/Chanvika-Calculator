<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="Unit Price Calculator — free calculator from Chanvika Calculator."><title>Unit Price Calculator — Chanvika Calculator</title><link rel="stylesheet" href="../style.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="../index.html">Chanvika Calculator</a><nav class="nav-links"><a href="../index.html">Calculators</a><a href="../faq.html">FAQs</a></nav></div></header><main><section class="container page"><a class="back" href="../index.html">← All calculators</a><h1>Unit Price Calculator</h1><p>Enter the values below to get an instant estimate.</p><div class="calculator-box"><div class="fields"><label>Total Price (₹)<input id="price" type="number" inputmode="decimal" step="any" placeholder="e.g. 250" min="0"></label><label>Quantity / Weight / Volume<input id="qty" type="number" inputmode="decimal" step="any" placeholder="e.g. 2" min="0"></label></div><button id="calculate">Calculate</button><div id="result" class="result" aria-live="polite"></div><p class="note">Use the same unit when comparing products, e.g. grams with grams or litres with litres.</p></div></section></main><footer class="footer"><div class="container">© 2026 Chanvika Calculator<div class="footer-links"><a href="../about.html">About Us</a><a href="../faq.html">FAQs</a><a href="../privacy-policy.html">Privacy Policy</a><a href="../terms-of-use.html">Terms of Use</a><a href="../disclaimer.html">Disclaimer</a></div></div></footer><script>document.getElementById('calculate').onclick=()=>{const result=document.getElementById('result');const p=+price.value,q=+qty.value;if(p<0||q<=0){result.textContent='Enter a valid price and quantity.';return}result.innerHTML=`<b>Price per unit:</b> ₹${(p/q).toFixed(2)}`;};</script></body></html>
