<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="Break-even Calculator — free calculator from Chanvika Calculator."><title>Break-even Calculator — Chanvika Calculator</title><link rel="stylesheet" href="../style.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="../index.html">Chanvika Calculator</a><nav class="nav-links"><a href="../index.html">Calculators</a><a href="../faq.html">FAQs</a></nav></div></header><main><section class="container page"><a class="back" href="../index.html">← All calculators</a><h1>Break-even Calculator</h1><p>Enter the values below to get an instant estimate.</p><div class="calculator-box"><div class="fields"><label>Fixed Costs (₹)<input id="fixed" type="number" inputmode="decimal" step="any" placeholder="e.g. 10000" min="0"></label><label>Selling Price / Unit (₹)<input id="price" type="number" inputmode="decimal" step="any" placeholder="e.g. 100" min="0"></label><label>Variable Cost / Unit (₹)<input id="variable" type="number" inputmode="decimal" step="any" placeholder="e.g. 60" min="0"></label></div><button id="calculate">Calculate</button><div id="result" class="result" aria-live="polite"></div></div></section></main><footer class="footer"><div class="container">© 2026 Chanvika Calculator<div class="footer-links"><a href="../about.html">About Us</a><a href="../faq.html">FAQs</a><a href="../privacy-policy.html">Privacy Policy</a><a href="../terms-of-use.html">Terms of Use</a><a href="../disclaimer.html">Disclaimer</a></div></div></footer><script>document.getElementById('calculate').onclick=()=>{const result=document.getElementById('result');const f=+fixed.value,p=+price.value,v=+variable.value;if(f<0||p<=v){result.textContent='Selling price must be greater than variable cost.';return}const q=f/(p-v);result.innerHTML=`<b>Break-even quantity:</b> ${q.toFixed(2)} units<br><b>Approx. units:</b> ${Math.ceil(q)}<br><b>Break-even sales:</b> ₹${(q*p).toFixed(2)}`;};</script></body></html>
