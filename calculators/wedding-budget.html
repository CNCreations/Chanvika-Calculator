<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="Wedding Budget Calculator — free calculator from Chanvika Calculator."><title>Wedding Budget Calculator — Chanvika Calculator</title><link rel="stylesheet" href="../style.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="../index.html">Chanvika Calculator</a><nav class="nav-links"><a href="../index.html">Calculators</a><a href="../faq.html">FAQs</a></nav></div></header><main><section class="container page"><a class="back" href="../index.html">← All calculators</a><h1>Wedding Budget Calculator</h1><p>Enter the values below to get an instant estimate.</p><div class="calculator-box"><div class="fields"><label>Venue / Food (₹)<input id="venue" type="number" inputmode="decimal" step="any" placeholder="e.g. 300000" min="0"></label><label>Decoration (₹)<input id="decor" type="number" inputmode="decimal" step="any" placeholder="e.g. 100000" min="0"></label><label>Photography / Video (₹)<input id="photo" type="number" inputmode="decimal" step="any" placeholder="e.g. 80000" min="0"></label><label>Clothes / Jewellery (₹)<input id="clothes" type="number" inputmode="decimal" step="any" placeholder="e.g. 150000" min="0"></label><label>Travel / Stay (₹)<input id="travel" type="number" inputmode="decimal" step="any" placeholder="e.g. 50000" min="0"></label><label>Other / Miscellaneous (₹)<input id="misc" type="number" inputmode="decimal" step="any" placeholder="e.g. 50000" min="0"></label></div><button id="calculate">Calculate</button><div id="result" class="result" aria-live="polite"></div><p class="note">Use your own vendor quotes and categories for a detailed wedding budget.</p></div></section></main><footer class="footer"><div class="container">© 2026 Chanvika Calculator<div class="footer-links"><a href="../about.html">About Us</a><a href="../faq.html">FAQs</a><a href="../privacy-policy.html">Privacy Policy</a><a href="../terms-of-use.html">Terms of Use</a><a href="../disclaimer.html">Disclaimer</a></div></div></footer><script>document.getElementById('calculate').onclick=()=>{const result=document.getElementById('result');const vals=[venue,decor,photo,clothes,travel,misc].map(x=>+x.value);if(vals.some(v=>v<0)){result.textContent='Enter valid amounts.';return}const total=vals.reduce((a,b)=>a+b,0);result.innerHTML=`<b>Estimated wedding budget:</b> ₹${total.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}`;};</script></body></html>
