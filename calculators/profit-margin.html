<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="description" content="Profit Margin Calculator — free calculator from Chanvika Calculator."><title>Profit Margin Calculator — Chanvika Calculator</title><link rel="stylesheet" href="../style.css"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="../index.html">Chanvika Calculator</a><nav class="nav-links"><a href="../index.html">Calculators</a><a href="../faq.html">FAQs</a></nav></div></header><main><section class="container page"><a class="back" href="../index.html">← All calculators</a><h1>Profit Margin Calculator</h1><p>Enter the values below to get an instant estimate.</p><div class="calculator-box"><div class="fields"><label>Cost Price (₹)<input id="cost" type="number" inputmode="decimal" step="any" placeholder="e.g. 500" min="0"></label><label>Selling Price (₹)<input id="selling" type="number" inputmode="decimal" step="any" placeholder="e.g. 700" min="0"></label></div><button id="calculate">Calculate</button><div id="result" class="result" aria-live="polite"></div><p class="note">Profit margin is calculated against selling price. A negative profit means a loss.</p></div></section></main><footer class="footer"><div class="container">© 2026 Chanvika Calculator<div class="footer-links"><a href="../about.html">About Us</a><a href="../faq.html">FAQs</a><a href="../privacy-policy.html">Privacy Policy</a><a href="../terms-of-use.html">Terms of Use</a><a href="../disclaimer.html">Disclaimer</a></div></div></footer><script>document.getElementById('calculate').onclick=()=>{const result=document.getElementById('result');const c=+cost.value,s=+selling.value;if(c<=0||s<0){result.textContent='Enter valid prices.';return}const p=s-c,m=s?p/s*100:0;result.innerHTML=`<b>Profit/Loss:</b> ₹${p.toFixed(2)}<br><b>Profit margin:</b> ${m.toFixed(2)}%`;};</script></body></html>
